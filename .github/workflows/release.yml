name: 发布 macOS ARM64 DMG

run-name: 发布 v${{ inputs.version }}（${{ github.sha }}）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 应用版本（不带 v 前缀）
        required: true
        default: 0.1.0
        type: string
      notes:
        description: 版本说明（Markdown，自上个版本的变更总结；留空则仅生成安装说明）
        required: false
        type: string

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_NOTES: ${{ inputs.notes }}
  RELEASE_TARGET: aarch64-apple-darwin

jobs:
  build:
    name: 构建并验证 ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: 检出触发提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 校验版本与已有标签
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-version.mjs "$RELEASE_VERSION"

          tag="v${RELEASE_VERSION}"
          tag_ref_file="$RUNNER_TEMP/release-tag-ref"
          if git ls-remote --exit-code origin "refs/tags/${tag}" > "$tag_ref_file"; then
            git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::标签 ${tag} 已指向 ${tag_commit}，当前提交为 ${GITHUB_SHA}；拒绝移动标签。"
              exit 1
            fi
            echo "标签 ${tag} 已指向当前提交，允许重跑。"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::读取远程标签 ${tag} 失败。"
              exit "$status"
            fi
            echo "标签 ${tag} 尚不存在，将在产物验证通过后创建。"
          fi

      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 与 ARM64 目标
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建未签名 ARM64 应用与 DMG
        run: pnpm tauri build --target "$RELEASE_TARGET" --bundles app,dmg --ci --no-sign

      - name: 验证并规范化 DMG
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${RELEASE_TARGET}/release/bundle/dmg"
          shopt -s nullglob
          dmg_files=("$bundle_dir"/*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            echo "::error::预期在 ${bundle_dir} 找到一个 DMG，实际找到 ${#dmg_files[@]} 个。"
            exit 1
          fi

          source_dmg="${dmg_files[0]}"
          source_name="$(basename "$source_dmg")"
          if [[ "$source_name" != *"${RELEASE_VERSION}"* || "$source_name" != *"aarch64"* ]]; then
            echo "::error::DMG 文件名必须包含版本 ${RELEASE_VERSION} 和架构 aarch64，实际为 ${source_name}。"
            exit 1
          fi

          mount_point="$RUNNER_TEMP/easytoagents-dmg"
          mkdir -p "$mount_point"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
          }
          trap cleanup EXIT
          hdiutil attach "$source_dmg" -readonly -nobrowse -mountpoint "$mount_point" -quiet

          apps=("$mount_point"/*.app)
          if [[ "${#apps[@]}" -ne 1 ]]; then
            echo "::error::预期 DMG 中有一个应用，实际找到 ${#apps[@]} 个。"
            exit 1
          fi

          app_path="${apps[0]}"
          info_plist="$app_path/Contents/Info.plist"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          minimum_system_version="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$info_plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          executable_path="$app_path/Contents/MacOS/$executable_name"

          if [[ "$bundle_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::DMG 内应用版本为 ${bundle_version}，期望 ${RELEASE_VERSION}。"
            exit 1
          fi
          if [[ "$minimum_system_version" != "13.0" ]]; then
            echo "::error::DMG 内应用最低系统版本为 ${minimum_system_version}，期望 13.0。"
            exit 1
          fi
          if [[ "$(lipo -archs "$executable_path")" != "arm64" ]]; then
            echo "::error::DMG 内应用二进制不是纯 ARM64：$(lipo -archs "$executable_path")"
            exit 1
          fi

          cleanup
          trap - EXIT

          release_dir="$RUNNER_TEMP/release"
          release_dmg="$release_dir/EasyToAgents_${RELEASE_VERSION}_aarch64.dmg"
          mkdir -p "$release_dir"
          mv "$source_dmg" "$release_dmg"
          shasum -a 256 "$release_dmg"

      - name: 保存已验证 DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EasyToAgents-${{ inputs.version }}-aarch64
          path: ${{ runner.temp }}/release/EasyToAgents_${{ inputs.version }}_aarch64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检出触发提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 下载已验证 DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyToAgents-${{ inputs.version }}-aarch64
          path: release

      - name: 校验或创建版本标签
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          tag_ref_file="$RUNNER_TEMP/release-tag-ref"
          if git ls-remote --exit-code origin "refs/tags/${tag}" > "$tag_ref_file"; then
            git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::标签 ${tag} 已指向 ${tag_commit}，当前提交为 ${GITHUB_SHA}；拒绝移动标签。"
              exit 1
            fi
            echo "复用指向当前提交的标签 ${tag}。"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::读取远程标签 ${tag} 失败。"
              exit "$status"
            fi
            git tag "$tag" "$GITHUB_SHA"
            if ! git push origin "refs/tags/${tag}"; then
              echo "::error::创建标签 ${tag} 失败；标签可能已被并发创建，请检查其目标提交后重跑。"
              exit 1
            fi
          fi

      - name: 创建或更新公开 Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          asset="release/EasyToAgents_${RELEASE_VERSION}_aarch64.dmg"
          notes_file="$RUNNER_TEMP/release-notes.md"

          {
            if [[ -n "${RELEASE_NOTES:-}" ]]; then
              printf '%s\n\n' "$RELEASE_NOTES"
              echo "---"
              echo
              echo "## 安装说明"
              echo
            else
              echo "EasyToAgents ${RELEASE_VERSION} 的 macOS 安装包。"
              echo
            fi
            echo "- 仅支持 Apple Silicon（M 系列）Mac"
            echo "- 最低系统版本：macOS 13"
            echo "- 此安装包未使用 Apple Developer 签名，也未经 Apple 公证"
            echo
            echo "首次打开若被 Gatekeeper 拦截，请在“应用程序”中右键 EasyToAgents 并选择“打开”，或前往“系统设置 → 隐私与安全性”选择“仍要打开”。"
          } > "$notes_file"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "EasyToAgents ${RELEASE_VERSION}" \
              --notes-file "$notes_file"
          fi

          gh release upload "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "EasyToAgents ${RELEASE_VERSION}" \
            --notes-file "$notes_file" \
            --draft=false \
            --prerelease=false
